<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>PRÆTOR FleetOps</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Oswald:wght@600;700&display=swap" rel="stylesheet">

<style>

:root{

--bg:#0A0D11;
--panel:#12161C;
--panel2:#171C24;
--border:#28303b;

--white:#E9EDF2;
--steel:#7C8798;

--accent:#E9EDF2;

--green:#3E8F5C;
--yellow:#C9A227;
--purple:#7B5FB0;
--orange:#C97A2E;
--blue:#3E7FB0;
--red:#C13B3B;

}


*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

background:
radial-gradient(circle at top,#18212b,#0A0D11 55%);

color:var(--white);

font-family:Inter,Arial;

display:flex;

justify-content:center;

padding:20px;

}


.app{

width:100%;

max-width:430px;

}


.header{

display:flex;

margin-bottom:20px;

}


.header-text{

line-height:1.15;

}


.title{

font-family:Oswald;

font-size:24px;

letter-spacing:1px;

}


.title span{

color:var(--accent);

}


.subtitle{

font-family:"JetBrains Mono";

font-size:10px;

color:var(--steel);

letter-spacing:1.5px;

margin-top:5px;

}


.card{

background:var(--panel);

border:1px solid var(--border);

padding:16px;

margin-bottom:14px;

}


label{

display:block;

font-family:"JetBrains Mono";

font-size:10px;

letter-spacing:1.2px;

color:var(--steel);

margin-bottom:6px;

}


input,textarea{

width:100%;

background:var(--panel2);

border:1px solid var(--border);

color:white;

padding:13px;

font-size:16px;

margin-bottom:15px;

outline:none;

}


input:focus,textarea:focus{

border-color:var(--accent);

}


.status-grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:10px;

}


.status{

background:var(--panel);

border:1px solid var(--border);

padding:14px;

color:white;

cursor:pointer;

text-align:left;

font-weight:600;

min-height:75px;

}


.status.active{

border-color:var(--accent);

background:#18202a;

}


.status small{

display:block;

font-family:"JetBrains Mono";

font-size:9px;

color:var(--steel);

margin-top:8px;

}


.indicator{

width:10px;

height:10px;

border-radius:50%;

display:block;

margin-bottom:8px;

}


.green{
border-left:4px solid var(--green);
}

.green .indicator{
background:var(--green);
}


.yellow{
border-left:4px solid var(--yellow);
}

.yellow .indicator{
background:var(--yellow);
}


.purple{
border-left:4px solid var(--purple);
}

.purple .indicator{
background:var(--purple);
}


.orange{
border-left:4px solid var(--orange);
}

.orange .indicator{
background:var(--orange);
}


.blue{
border-left:4px solid var(--blue);
}

.blue .indicator{
background:var(--blue);
}


.gray{
border-left:4px solid #8B96A5;
}

.gray .indicator{
background:#8B96A5;
}


.red{
border-left:4px solid var(--red);
}

.red .indicator{
background:var(--red);
}


.full{
grid-column:1 / 3;
}


.gps{

font-family:"JetBrains Mono";

font-size:11px;

color:var(--green);

margin:10px 0;

}


.send{

width:100%;

padding:16px;

background:#2563eb;

border:none;

color:white;

font-size:16px;

font-weight:700;

cursor:pointer;

}


.send:disabled{

opacity:.6;

cursor:not-allowed;

}


.footer{

text-align:center;

font-family:"JetBrains Mono";

font-size:10px;

color:var(--steel);

margin-top:15px;

}


.hint{

font-family:"JetBrains Mono";

font-size:9px;

color:var(--steel);

margin:-8px 0 15px;

letter-spacing:.6px;

}

</style>

</head>


<body>


<div class="app">


<div class="header">

<div class="header-text">

<div class="title">
PRÆTOR FleetOps
</div>

<div class="subtitle">
OPERATIONAL TRACKING SYSTEM
</div>

</div>

</div>



<form
id="fleetForm"
method="POST">


<div class="card">


<label>
CONDUCTOR
</label>


<input
name="conductor"
placeholder="Nombre y apellido"
required>


<label>
PATENTE
</label>


<input
name="patente"
placeholder="AB-CD-12"
style="text-transform:uppercase"
required>


<input
type="hidden"
name="empresa"
value="">


<input
type="hidden"
name="ruta"
value="">


<input
type="hidden"
id="latitud"
name="latitud">


<input
type="hidden"
id="longitud"
name="longitud">


<input
type="hidden"
id="precision"
name="precision_gps">


<input
type="hidden"
id="maps"
name="google_maps">


<input
type="hidden"
id="hora"
name="timestamp">


</div>



<div class="card">


<label>
ESTADO OPERACIONAL
</label>


<div class="status-grid">


<button
type="button"
class="status green"
onclick="setStatus(this,'En ruta')">

<span class="indicator"></span>

En ruta

<small>
EN_TRANSITO
</small>

</button>


<button
type="button"
class="status yellow"
onclick="setStatus(this,'Esperando carga')">

<span class="indicator"></span>

Esperando carga

<small>
ESPERA_CARGA
</small>

</button>


<button
type="button"
class="status purple"
onclick="setStatus(this,'Cargando')">

<span class="indicator"></span>

Cargando

<small>
CARGANDO
</small>

</button>


<button
type="button"
class="status orange"
onclick="setStatus(this,'Esperando descarga')">

<span class="indicator"></span>

Esperando descarga

<small>
ESPERA_DESCARGA
</small>

</button>


<button
type="button"
class="status blue"
onclick="setStatus(this,'Descargando')">

<span class="indicator"></span>

Descargando

<small>
DESCARGANDO
</small>

</button>


<button
type="button"
class="status gray"
onclick="setStatus(this,'Finalizado')">

<span class="indicator"></span>

Finalizado

<small>
CIERRE_OPERACION
</small>

</button>


<button
type="button"
class="status red full"
onclick="setStatus(this,'Incidente')">

<span class="indicator"></span>

Incidente

<small>
ALERTA_OPERACIONAL
</small>

</button>


</div>


<input
type="hidden"
id="estado"
name="estado">


</div>



<div class="card">


<label>
OBSERVACIÓN
</label>


<textarea
name="observacion"
rows="3"
placeholder="Detalles adicionales"></textarea>


<div
class="gps"
id="gps">

GPS ADQUIRIENDO...

</div>


<button
type="submit"
class="send">

ENVIAR ACTUALIZACIÓN

</button>


</div>


</form>



<div class="footer">

PRÆTOR TECHNOLOGIES · FleetOps

</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase-config.js"></script>
<script src="js/supabase.js"></script>

<script src="js/app.js?v=4"></script>


</body>

</html>
