name: checks

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "24.22.1"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleetops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fleetops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: node --check
        run: |
          set -euo pipefail
          for f in js/*.js scripts/*.mjs; do
            node --check "$f"
          done
      - name: npm test
        run: npm test
      - name: login next
        run: node scripts/test-login-next.mjs
      - name: build guard
        run: node scripts/test-build-config.mjs
      - name: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_ci_dummy
        run: npm run build
      - name: supabase sql suite
        run: |
          set -euo pipefail
          python3 -m venv /tmp/fleetops-sql
          /tmp/fleetops-sql/bin/pip install 'psycopg[binary]'
          /tmp/fleetops-sql/bin/python supabase/tests/local/run_local.py "host=127.0.0.1 port=5432 dbname=fleetops user=postgres password=postgres"
