name: checks

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "24.22.1"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: node --check
        run: |
          set -euo pipefail
          for f in js/*.js scripts/*.mjs; do
            node --check "$f"
          done
      - name: npm test
        run: npm test
