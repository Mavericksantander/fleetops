<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">


<title>
PRÆTOR FleetOps | Confirmación
</title>


<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Oswald:wght@600;700&display=swap"
rel="stylesheet">


<style>

:root{

--bg:#0A0D11;
--panel:#12161C;
--border:#28303B;
--white:#E9EDF2;
--steel:#7C8798;
--green:#3E8F5C;

}


*{

box-sizing:border-box;

}


body{

margin:0;

min-height:100vh;

background:
radial-gradient(
circle at top,
#18212B,
#0A0D11 55%
);

color:var(--white);

font-family:Inter,Arial;

display:flex;

align-items:center;

justify-content:center;

padding:20px;

}


.card{

width:100%;

max-width:430px;

background:var(--panel);

border:1px solid var(--border);

padding:35px 25px;

text-align:center;

}


.logo{

font-family:Oswald;

font-size:25px;

letter-spacing:1px;

margin-bottom:5px;

}


.subtitle{

font-family:"JetBrains Mono";

font-size:9px;

letter-spacing:1.5px;

color:var(--steel);

}


.check{

width:70px;

height:70px;

border-radius:50%;

border:2px solid var(--green);

display:flex;

align-items:center;

justify-content:center;

margin:35px auto 20px;

font-size:32px;

color:var(--green);

}


.title{

font-family:Oswald;

font-size:24px;

letter-spacing:1px;

}


.text{

font-size:13px;

color:var(--steel);

line-height:1.6;

margin-top:10px;

}


.button{

display:block;

margin-top:25px;

padding:14px;

background:#2563eb;

color:white;

text-decoration:none;

font-size:13px;

font-weight:700;

}


.footer{

margin-top:25px;

font-family:"JetBrains Mono";

font-size:9px;

color:var(--steel);

}

</style>

</head>


<body>


<div class="card">


<div class="logo">
PRÆTOR FleetOps
</div>


<div class="subtitle">
OPERATIONAL TRACKING SYSTEM
</div>


<div class="check">
✓
</div>


<div class="title">
ACTUALIZACIÓN RECIBIDA
</div>


<div class="text">

El reporte operacional fue
registrado correctamente.

<br>

La información ha sido incorporada
al sistema FleetOps.

</div>


<a
href="reportes.html"
class="button">

NUEVO REPORTE

</a>


<div class="footer">

PRÆTOR TECHNOLOGIES

</div>


</div>


<script>
(function () {
    var viaje = (new URLSearchParams(window.location.search).get("viaje") || "").trim();
    var link = document.querySelector("a.button");

    if (!link || !viaje) {
        return;
    }

    link.href = "reportes.html?viaje=" + encodeURIComponent(viaje);
})();
</script>

</body>

</html>
